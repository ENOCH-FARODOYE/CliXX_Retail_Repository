---
  - name: "Delete DB"
    hosts: localhost
    connection: local
    vars:
      instance_id: "{{ lookup('env', 'ANSIBLE_RDS_INSTANCE_ID') }}"
      ansible_python_interpreter: "{{ lookup('env', 'VIRTUAL_ENV') }}/bin/python3"
    tasks:
      - name: remove a db instance without taking a final snapshot
        community.aws.rds_instance:
            id: "{{ instance_id }}"
            state: absent
            skip_final_snapshot: True
            region: us-east-1
