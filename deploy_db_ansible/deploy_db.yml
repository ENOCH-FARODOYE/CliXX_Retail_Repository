---
  - name: "CliXX DB Deployment Ansible Playbook"
    hosts: localhost
    connection: local
    vars:
      instance_id: "{{ lookup('env', 'ANSIBLE_RDS_INSTANCE_ID') }}"
      db_snapshot: "{{ lookup('env', 'ANSIBLE_RDS_SNAPSHOT_ARN') }}"
      ansible_python_interpreter: "{{ lookup('env', 'VIRTUAL_ENV') }}/bin/python3"
    tasks:
       - name: Restore DB from snapshot
         community.aws.rds_instance:
           id: '{{ instance_id }}'
           state: present
           creation_source: snapshot
           snapshot_identifier: '{{ db_snapshot }}'
           engine: mysql
           region: us-east-1
           instance_type: db.t3.small
           wait: yes
