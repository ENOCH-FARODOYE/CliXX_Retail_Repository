---
  - name: "CliXX DB Deployment Ansible Playbook"
    hosts: localhost
    connection: local
    vars:
      instance_id: wordpressdbclixxjenkins
      db_snapshot: clixx-db-final-snapshot
      security_group: sg-00014b7e773d4da45
    tasks:
       - name: Restore DB from snapshot
         community.aws.rds_instance:
           id: '{{ instance_id }}'
           state: present
           creation_source: snapshot
           snapshot_identifier: '{{ db_snapshot }}'
           engine: mysql
           region: us-east-1
           instance_type: db.t2.small
           wait: yes
           
       - name: Modify to add SG
         community.aws.rds_instance:
           id: '{{ instance_id }}'
           vpc_security_group_ids: 
             - '{{ security_group }}'
           region: us-east-1
           apply_immediately: yes
